# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test
# Node.js CI Workflow Analysis

This is a standard GitHub Actions workflow for continuous integration of a Node.js project. Here's a breakdown of what it does and some observations:

## What it does

| Step | Purpose |
|------|---------|
| **Triggers** | Runs on pushes and PRs targeting the `master` branch |
| **Matrix** | Tests against Node.js 18.x, 20.x, and 22.x |
| **Runner** | `ubuntu-latest` |
| **Steps** | Checkout → setup Node (with npm cache) → `npm ci` → `npm run build --if-present` → `npm test` |

## Issues & suggestions

### 1. `npm ci` will fail without a lockfile
`npm ci` requires a `package-lock.json` (or `npm-shrinkwrap.json`). Make sure it's committed. If you use yarn/pnpm, swap this for `yarn install --frozen-lockfile` or `pnpm install --frozen-lockfile`.

### 2. Node.js 18 is EOL
Node 18 reached end-of-life in **April 2025**. Consider dropping it and testing on **20.x, 22.x, and 24.x** instead:
```yaml
node-version: [20.x, 22.x, 24.x]
```

### 3. `master` vs `main`
GitHub's default branch is now `main` for new repos. If your repo uses `main`, update both branch references.

### 4. Caching caveat
`actions/setup-node@v4` with `cache: 'npm'` only caches the npm global cache — not `node_modules`. This is usually the right choice, but be aware it requires a lockfile to compute the cache key.

### 5. Matrix `fail-fast`
By default, if one Node version fails, the others are cancelled. If you want full visibility across versions, add:
```yaml
strategy:
  fail-fast: false
  matrix:
    node-version: [20.x, 22.x, 24.x]
```

### 6. Missing permissions block (security hardening)
GitHub recommends pinning down token permissions:
```yaml
permissions:
  contents: read
```

### 7. `--if-present` on build
Good defensive choice — it won't fail if `build` script is missing. But note: `npm test` does **not** use `--if-present`, so a missing `test` script will fail the job. That's usually intentional, but worth knowing.

## Suggested improved version

```yaml
name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
```

## Optional enhancements

- **Coverage reporting**: pipe `npm test` output to Codecov / Coveralls.
- **Linting**: add `npm run lint --if-present` before tests.
- **Artifacts**: upload build output with `actions/upload-artifact@v4` if you need it downstream.
- **Concurrency control**: cancel superseded runs on the same branch:
  ```yaml
  concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
  ```


