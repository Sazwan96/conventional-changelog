Great — here’s an upgraded workflow that adds **linting**, **coverage**, **artifact upload**, and optional **Codecov**. I’ll assume a typical Node project with ESLint and Jest/Vitest. If you tell me the exact framework/test runner, I can narrow it further.

```yaml
name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build --if-present

      - name: Test with coverage
        run: npm run test:coverage --if-present

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.node-version }}
          path: coverage/
          if-no-files-found: ignore

      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
```

## Add these `package.json` scripts

Pick the one that matches your test runner.

**Jest**
```json
{
  "scripts": {
    "lint": "eslint .",
    "test": "jest",
    "test:coverage": "jest --coverage"
  }
}
```

**Vitest**
```json
{
  "scripts": {
    "lint": "eslint .",
    "test": "vitest run",
    "test:coverage": "vitest run --coverage"
  }
}
```

**Mocha + c8**
```json
{
  "scripts": {
    "lint": "eslint .",
    "test": "mocha",
    "test:coverage": "c8 npm test"
  }
}
```

## Framework notes

- **React / Vite**: keep `npm run build`; coverage usually comes from Vitest or Jest. Upload `dist/` only if you need build artifacts.
- **Next.js**: `npm run lint` and `npm run build` are built in. Add `test:coverage` if you use Jest/Vitest.
- **Express / Node API**: you may not need a build step unless you use TypeScript. Use `c8` or `nyc` for coverage.
- **TypeScript**: add `npm run typecheck` if you have it, e.g. `tsc --noEmit`.

## Important

- `npm ci` requires a committed `package-lock.json`.
- Node 18 is EOL — I removed it. Add it back only if you must support it.
- If your default branch is `master`, change `main` back to `master`.
- For Codecov on a public repo, the token may be optional. For private repos, add `CODECOV_TOKEN` in GitHub repo secrets.

